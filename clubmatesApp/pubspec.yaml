name: clubmates
description: "Find your people. Own the night."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  google_fonts: ^6.3.2
  geolocator: ^13.0.4
  image_picker: ^1.2.3
  supabase_flutter: ^2.18.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  liquid_glass_widgets: ^1.13.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: assets/photos/clubmateslogo.png

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
